<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14161a">
  <meta name="description" content="Plexus：和 Plex 同步的影视收藏，对比硬盘上的实际文件。">
  <title>Plexus · 我的影视</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Plexus">
  <link rel="stylesheet" href="style.css?v=dev">
  <script defer src="common.js?v=dev"></script>
  <script defer src="app.js?v=dev"></script>
  <script defer src="tree.js?v=dev"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Plexus 首页"><img src="favicon.svg" alt=""><span>Plexus<small>和 Plex 同步的影视收藏</small></span></a>
    <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索片名、原名或文件夹" autocomplete="off"></label>
    <div class="top-actions">
      <a id="downloads-link" class="button secondary" href="downloads.html" title="从网盘链接下载，查看下载进度"><span data-icon="download"></span><span>下载</span><span id="downloads-count" class="count" hidden></span></a>
      <button id="tree-button" class="button secondary" title="查看每个盘和文件夹里有多少视频"><span data-icon="folder"></span><span>目录树</span></button>
      <button id="sync-button" class="button secondary" title="立即和 Plex 同步并扫描硬盘"><span data-icon="refresh"></span><span id="sync-label">同步</span></button>
      <button id="settings-button" class="icon-button" aria-label="设置" title="设置"><span data-icon="settings"></span></button>
    </div>
  </header>

  <main>
    <section id="summary" class="summary" aria-live="polite"></section>
    <div id="alert" class="alert" hidden></div>
    <nav class="filters" aria-label="筛选">
      <div id="sections" class="tabs" role="tablist"></div>
      <button id="wish-add" class="button" hidden><span data-icon="plus"></span><span>添加想看</span></button>
      <div class="filter-controls">
        <select id="drive-filter" aria-label="所在硬盘"><option value="">全部硬盘</option></select>
        <select id="sort" aria-label="排序">
          <option value="added">最近添加</option><option value="title">片名</option><option value="year">年份</option><option value="size">占用空间</option>
        </select>
      </div>
    </nav>
    <p id="result-count" class="result-count"></p>
    <section id="grid" class="grid" aria-label="影视"></section>
    <div id="pager" class="pager" hidden><button id="more" class="button secondary">显示更多</button></div>
  </main>

  <dialog id="detail-dialog" class="sheet detail">
    <button class="close" data-close aria-label="关闭">×</button>
    <div id="detail"></div>
  </dialog>

  <dialog id="delete-dialog" class="sheet narrow wide-ish"><div id="delete-body"></div></dialog>

  <dialog id="wish-dialog" class="sheet narrow">
    <button class="close" data-close aria-label="关闭">×</button>
    <form id="wish-form" class="stack">
      <h2 id="wish-title-text">添加想看</h2>
      <label>在 Plex 的在线资料库里搜索<input id="wish-query" type="search" placeholder="输入片名，选择后自动填写" autocomplete="off"></label>
      <ul id="wish-results" class="search-results"></ul>
      <input id="wish-id" type="hidden">
      <div class="row"><label class="grow">片名<input id="wish-title" type="text" required></label><label class="year">年份<input id="wish-year" type="text" inputmode="numeric" maxlength="4"></label>
        <label>类型<select id="wish-kind"><option value="movie">电影</option><option value="show">剧集</option></select></label></div>
      <label>网盘链接（夸克或百度，可以带提取码，一行一个）<textarea id="wish-links" rows="3" placeholder="https://pan.quark.cn/s/…"></textarea></label>
      <label>备注<input id="wish-note" type="text" maxlength="200" placeholder="例如：等 4K 版本"></label>
      <div class="dialog-actions"><button id="wish-delete" class="button secondary danger" type="button" hidden>删除</button><button id="wish-owned" class="button secondary" type="button" hidden>已拥有 · 查看</button>
        <button id="wish-download" class="button secondary" type="button" hidden><span data-icon="download"></span><span>去下载</span></button><button class="button" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="tree-dialog" class="sheet tree">
    <button class="close" data-close aria-label="关闭">×</button>
    <h2>目录树</h2>
    <p id="tree-summary" class="muted"></p>
    <ul id="tree-root" class="tree-list" role="tree"></ul>
  </dialog>

  <dialog id="settings-dialog" class="sheet narrow">
    <button class="close" data-close aria-label="关闭">×</button>
    <h2>设置</h2>
    <form id="plex-form" class="stack">
      <h3>Plex Media Server</h3>
      <p id="plex-info" class="muted"></p>
      <label>Plex 地址<input id="plex-url" type="url" placeholder="http://127.0.0.1:32400"></label>
      <p class="muted">登录信息自动从这台电脑上的 Plex Media Server 读取，不需要填写。</p>
      <button class="button" type="submit">保存并同步</button>
    </form>
    <form id="password-form" class="stack">
      <h3>网页版访问</h3>
      <p id="password-info" class="muted"></p>
      <label>访问密码<input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="至少 6 个字符"></label>
      <button class="button" type="submit">设置访问密码</button>
    </form>
    <p id="remote-only" class="muted" hidden>Plex 地址和访问密码只能在运行 Plex 的 Windows 电脑上修改。</p>
    <button id="logout" class="button secondary" hidden>退出登录</button>
  </dialog>

</body>
</html>
