<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14161a">
  <meta name="description" content="Plexus 下载：粘贴夸克或百度网盘链接，下载到 Plex 媒体库并按 Plex 格式命名。">
  <title>Plexus · 下载</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Plexus">
  <link rel="stylesheet" href="style.css?v=dev">
  <script defer src="common.js?v=dev"></script>
  <script defer src="downloads.js?v=dev"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Plexus 首页"><img src="favicon.svg" alt=""><span>Plexus<small>下载</small></span></a>
    <div class="top-actions">
      <div id="accounts" class="accounts"></div>
      <a class="button secondary" href="./"><span data-icon="film"></span><span>影视库</span></a>
    </div>
  </header>

  <main class="downloads">
    <section class="panel">
      <h2>添加下载</h2>
      <form id="paste-form" class="paste">
        <textarea id="paste" rows="3" placeholder="粘贴夸克网盘或百度网盘的分享链接，提取码可以一起粘贴，一次可以粘贴多个链接"></textarea>
        <button class="button" type="submit"><span data-icon="link"></span><span>读取链接</span></button>
      </form>
      <p id="paste-error" class="error-text" hidden></p>
      <div id="shares"></div>
    </section>

    <section>
      <div class="queue-head"><h2>下载队列</h2><span id="queue-summary" class="muted"></span></div>
      <div id="queue"></div>
    </section>
  </main>

  <dialog id="login-drive-dialog" class="sheet narrow">
    <button class="close" data-close aria-label="关闭">×</button>
    <h2 id="drive-login-title">扫码登录</h2>
    <div id="drive-qr" class="qr"></div>
    <p id="drive-login-status" class="muted"></p>
    <p class="muted">登录保存在 Windows 电脑上，在 Plexus 和书屿之间共用：在任意一处登录，另一处不用再扫码。</p>
    <button id="drive-login-retry" class="button" hidden>重新获取二维码</button>
  </dialog>
</body>
</html>
